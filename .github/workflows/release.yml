---
name: Release

on:
  push:
    tags: ['v*']

# No workflow-level grants: each job declares exactly what it needs.
permissions: {}

jobs:
  # Runs repo-controlled code (Makefile, Dockerfile) from the tagged commit, so
  # it gets a read-only token and no OIDC. It also gates the release: nothing
  # downstream runs unless the tag is on main, the tests pass, and the build is
  # reproducible. (ci.yml also fires on the tag push but does not gate this.)
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so the ancestry check below is real
          persist-credentials: false
      # The tag becomes the public audit anchor, so it must be a commit that
      # went through main, not an arbitrary branch.
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of main; refusing to release"
            exit 1
          }
      - name: Test
        run: make test
      - name: Build
        run: make build
      - name: Check build is reproducible
        run: make repro-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # A plain "Re-run all jobs" rebuilds dist/ and would otherwise fail
          # here because an artifact with this name already exists in the run.
          overwrite: true

  # The GitHub release is the public audit anchor, so it exists before the
  # artifact reaches any bucket a customer's Lambda reads. Needs a write token
  # but runs no repo code: no checkout, only the verified artifact.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      # Decides what to do from the release's state, before anything is
      # uploaded and before `publish` can touch S3:
      #
      #   no release            -> create it as a pre-release
      #   exists, pre-release   -> an interrupted publish; resume it
      #   exists, complete      -> refuse; the tag is already published
      #
      # A completed release must never be re-pointed: re-running the workflow
      # rebuilds from unpinned apk packages, so the bytes can legitimately
      # differ from the published ones. Uploading them with --clobber and then
      # running `make publish` would silently change what a published tag means.
      # Only a pre-release (never promoted, visible as incomplete) is resumable.
      # Anything ambiguous about whether the release exists fails closed.
      - name: Create or resume GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          release_json="$(mktemp)"
          release_err="$(mktemp)"
          trap 'rm -f "$release_json" "$release_err"' EXIT

          if gh release view "$GITHUB_REF_NAME" --json isPrerelease \
              >"$release_json" 2>"$release_err"; then
            # Plain -r, not -e: `jq -e` exits 1 for a legitimate `false`,
            # which would send the completed-release case down the error path.
            if ! is_prerelease="$(jq -r '.isPrerelease' "$release_json")"; then
              echo "::error::gh release view returned unparseable JSON; refusing to continue"
              exit 1
            fi

            case "$is_prerelease" in
              true)
                echo "Release $GITHUB_REF_NAME is a pre-release: resuming the interrupted publish."
                gh release upload "$GITHUB_REF_NAME" --clobber \
                  dist/soci_index_generator_lambda.zip \
                  dist/soci_index_generator_lambda.zip.sha256 \
                  dist/bootstrap.sha256
                exit 0
                ;;
              false)
                echo "::error title=Release already published::Tag $GITHUB_REF_NAME is a completed release. Re-publishing it would change the bytes under an already-published key, so nothing was uploaded and S3 was not touched. To ship a fix, create a new tag."
                exit 1
                ;;
              *)
                echo "::error::gh release view returned no boolean isPrerelease; refusing to continue"
                exit 1
                ;;
            esac
          else
            status=$?
          fi

          # `gh release view` reports a missing release as exit 1 with
          # "release not found". Match that exact phrase: a permissions or
          # network failure can also mention "not found" (e.g. a repository
          # error), and treating one of those as "no release" would fall
          # through to `gh release create`.
          if [ "$status" -eq 1 ] && grep -Fq 'release not found' "$release_err"; then
            echo "Release $GITHUB_REF_NAME does not exist: creating it as a pre-release."
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --prerelease \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/soci_index_generator_lambda.zip \
              dist/soci_index_generator_lambda.zip.sha256 \
              dist/bootstrap.sha256
            exit 0
          fi

          echo "::error::Could not determine whether release $GITHUB_REF_NAME exists (gh exit $status); refusing to create or upload anything."
          cat "$release_err" >&2
          exit 1

  # Holds the OIDC grant but no repo write access. `make publish` re-verifies
  # the downloaded zip against its .sha256 before uploading anything.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for configure-aws-credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::101287669015:role/soci-index-generator-github-actions
          aws-region: us-east-1
      - name: Publish to regional buckets
        run: make publish VERSION="$GITHUB_REF_NAME"

  # Only after every region has the zip does the release stop being a pre-release.
  finalize:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark release complete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease=false
