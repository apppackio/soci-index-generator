---
name: CI

on:
  # Scope pushes to main. An unfiltered `push` trigger plus `pull_request`
  # runs every PR branch twice (one run per event), paying for the full test,
  # build and cold reproducibility check twice. Tag pushes are covered by
  # release.yml, which runs the same checks before publishing.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Everything runs in the pinned builder container; the runner needs only
      # Docker, so there is deliberately no setup-go here.
      - name: Test
        run: make test
      - name: Build
        run: make build
      # Double-build comparison; see the repro-check target in the Makefile.
      - name: Check build is reproducible
        run: make repro-check
